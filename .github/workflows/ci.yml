name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Ruff
        run: uv run ruff check apps/api/src tests
      - name: Mypy
        run: uv run mypy apps/api/src/masms_api
      - name: Pytest
        run: uv run pytest -q

  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci --prefix apps/web
      - name: Lint
        run: npm --prefix apps/web run lint
      - name: Build
        run: npm --prefix apps/web run build
