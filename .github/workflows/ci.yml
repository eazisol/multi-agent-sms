name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Ruff
        run: uv run ruff check apps/api/src tests
      - name: Mypy
        run: uv run mypy apps/api/src/masms_api
      - name: Pytest
        run: uv run pytest -q --junitxml=reports/api-junit.xml
      - name: Upload API junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-junit-${{ github.sha }}
          path: reports/api-junit.xml
          if-no-files-found: ignore

  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci --prefix apps/web
      - name: Lint
        run: npm --prefix apps/web run lint
      - name: Build
        run: npm --prefix apps/web run build
      - name: Upload web build marker
        uses: actions/upload-artifact@v4
        with:
          name: web-build-meta-${{ github.sha }}
          path: apps/web/package.json

  traceability:
    name: Artifact traceability
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - name: Record commit identity
        run: |
          mkdir -p reports
          {
            echo "git_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "actor=${GITHUB_ACTOR}"
          } > reports/build-identity.txt
          cat reports/build-identity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: build-identity-${{ github.sha }}
          path: reports/build-identity.txt
