services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: masms
      POSTGRES_USER: masms
      POSTGRES_PASSWORD: masms_dev_only
    ports:
      - "5432:5432"
    volumes:
      - masms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masms -d masms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional local object-storage stand-in for later file modules (not required for MOD-010/030).
  # Uncomment when needed:
  # localstack:
  #   image: localstack/localstack:3
  #   ports:
  #     - "4566:4566"
  #   environment:
  #     SERVICES: s3,secretsmanager

volumes:
  masms_pg_data:
