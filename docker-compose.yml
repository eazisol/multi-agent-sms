services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: masms
      POSTGRES_USER: masms
      POSTGRES_PASSWORD: masms_dev_only
    ports:
      - "5432:5432"
    volumes:
      - masms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masms -d masms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  masms_pg_data:
