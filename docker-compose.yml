services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: masms
      POSTGRES_USER: masms
      POSTGRES_PASSWORD: masms_dev_only
    ports:
      - "5432:5432"
    volumes:
      - masms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masms -d masms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional local object-storage stand-in for later MOD-250 work (not required for MOD-010).
  # Uncomment when needed:
  # azurite:
  #   image: mcr.microsoft.com/azure-storage/azurite
  #   ports:
  #     - "10000:10000"
  #     - "10001:10001"
  #     - "10002:10002"

volumes:
  masms_pg_data:
