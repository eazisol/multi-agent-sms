[project]
name = "masms-api"
version = "0.1.0"
description = "MASMS FastAPI application"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "psycopg[binary]>=3.2.0",
  "pyjwt[crypto]>=2.13.0",
  "temporalio>=1.31.0",
  "langgraph>=1.2.11",
  "openai>=3.1.0",
  "pgvector>=0.5.0",
  "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/masms_api"]

[tool.hatch.build.targets.wheel.sources]
"src/masms_api" = "masms_api"
